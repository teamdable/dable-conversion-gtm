<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dable Conversion DPA Test</title>

    <!-- Google Tag Manager - Official Installation Code -->
    <script>
      window.dataLayer = window.dataLayer || [];
      // 상품 상세 페이지: GTM 로드 전에 dable_items 세팅
      // All Pages 트리거의 PageView 태그가 이 값을 자동으로 가져감
      dataLayer.push({
        'dable_items': [{ 'product_id': '12345' }]
      });
    </script>
    <script>(function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':
    new Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],
    j=d.createElement(s),dl=l!='dataLayer'?'&l='+l:'';j.async=true;j.src=
    'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);
    })(window,document,'script','dataLayer','GTM-XXXXXXX');</script>
    <!-- End Google Tag Manager -->

    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        button { padding: 10px 20px; margin: 5px; font-size: 16px; border: none; color: white; cursor: pointer; }
        .btn-cart { background: #e67e22; }
        .btn-purchase { background: #e74c3c; }
        .log { background: #f4f4f4; padding: 10px; margin-top: 20px; font-family: monospace; white-space: pre-wrap; }
        .alert { background: #f39c12; color: white; padding: 10px; margin: 10px 0; }
    </style>
</head>
<body>
    <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-XXXXXXX"
    height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>

    <h1>Dable DPA Test</h1>

    <div class="alert">
        <strong>설정 필요:</strong> GTM-XXXXXXX를 실제 GTM ID로 변경하고, GTM에서 dable_items 변수를 생성하세요.
    </div>

    <h2>DPA 이벤트 테스트</h2>
    <p>PageView는 페이지 로드 시 자동으로 전송됩니다 (상품 ID: 12345)</p>
    <button class="btn-cart" onclick="testAddToCart()">장바구니 추가</button>
    <button class="btn-purchase" onclick="testPurchase()">구매 완료</button>

    <h2>DataLayer 로그</h2>
    <button onclick="clearLog()">로그 지우기</button>
    <div id="log" class="log">로그가 여기에 표시됩니다...</div>

    <script>
        function log(message, data) {
            const logDiv = document.getElementById('log');
            const timestamp = new Date().toLocaleTimeString();
            let logMessage = '[' + timestamp + '] ' + message;
            if (data) {
                logMessage += '\n' + JSON.stringify(data, null, 2);
            }
            logDiv.textContent += logMessage + '\n\n';
        }

        function testAddToCart() {
            dataLayer.push({
                'dable_items': [{ 'product_id': '12345' }],
                'event': 'add_to_cart'
            });
            log('AddToCart 이벤트 전송', {
                dable_items: [{ product_id: '12345' }]
            });
        }

        function testPurchase() {
            dataLayer.push({
                'purchase_value': 89000,
                'purchase_currency': 'KRW',
                'dable_items': [
                    { 'product_id': '12345' },
                    { 'product_id': '67890' }
                ],
                'event': 'purchase_completed'
            });
            log('Purchase 이벤트 전송', {
                purchase_value: 89000,
                purchase_currency: 'KRW',
                dable_items: [{ product_id: '12345' }, { product_id: '67890' }]
            });
        }

        function clearLog() {
            document.getElementById('log').textContent = '로그가 여기에 표시됩니다...\n';
        }

        window.addEventListener('load', function() {
            log('페이지 로드 완료 - PageView에 dable_items 포함됨', {
                dable_items: [{ product_id: '12345' }]
            });
        });
    </script>
</body>
</html>
