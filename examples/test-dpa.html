<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DPA Test Page</title>
    <!-- GTM DATA LAYER -->
    <script>
        window.dataLayer = window.dataLayer || [];
        // 상품 상세 페이지: GTM 로드 전에 dable_items 세팅
        // All Pages 트리거의 ViewContent 태그가 이 값을 자동으로 가져감
        dataLayer.push({
            'dable_items': [
                { 'product_id': 'SKU-001' }
            ]
        });
    </script>
    <!-- Google Tag Manager -->
    <!-- GTM-XXXXXXX를 실제 GTM 컨테이너 ID로 변경하세요 -->
    <script>(function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':
    new Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],
    j=d.createElement(s),dl=l!='dataLayer'?'&l='+l:'';j.async=true;j.src=
    'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);
    })(window,document,'script','dataLayer','GTM-XXXXXXX');</script>
    <!-- End Google Tag Manager -->
    <style>
        body { font-family: sans-serif; max-width: 600px; margin: 40px auto; padding: 0 20px; }
        h1 { font-size: 20px; }
        button { padding: 10px 20px; margin: 8px 4px; cursor: pointer; font-size: 14px; }
        .btn-view { background: #4CAF50; color: white; border: none; border-radius: 4px; }
        .btn-cart { background: #2196F3; color: white; border: none; border-radius: 4px; }
        .btn-purchase { background: #FF5722; color: white; border: none; border-radius: 4px; }
        #log { margin-top: 20px; padding: 12px; background: #f5f5f5; border-radius: 4px; font-size: 13px; font-family: monospace; white-space: pre-wrap; max-height: 300px; overflow-y: auto; }
    </style>
</head>
<body>
    <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-XXXXXXX"
    height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>

    <h1>Dable DPA Test</h1>
    <p>버튼을 눌러 dataLayer.push 이벤트를 테스트하세요.</p>
    <p><strong>사전 설정:</strong> GTM-XXXXXXX를 실제 GTM 컨테이너 ID로 변경 후 사용</p>

    <button class="btn-view" onclick="fireViewContent()">ViewContent (상품 상세)</button>
    <button class="btn-cart" onclick="fireAddToCart()">AddToCart (장바구니)</button>
    <button class="btn-purchase" onclick="firePurchase()">Purchase (구매)</button>

    <div id="log">-- 로그 --</div>

    <script>
        function appendLog(msg) {
            var el = document.getElementById('log');
            el.textContent += '\n' + new Date().toLocaleTimeString() + ' ' + msg;
            el.scrollTop = el.scrollHeight;
        }

        function fireViewContent() {
            dataLayer.push({
                'dable_items': [
                    { 'product_id': 'SKU-001' }
                ],
                'event': 'view_content'
            });
            appendLog('[ViewContent] dable_items: [{product_id: "SKU-001"}]');
        }

        function fireAddToCart() {
            dataLayer.push({
                'dable_items': [
                    { 'product_id': 'SKU-001' }
                ],
                'event': 'add_to_cart'
            });
            appendLog('[AddToCart] dable_items: [{product_id: "SKU-001"}]');
        }

        function firePurchase() {
            dataLayer.push({
                'purchase_value': 89000,
                'purchase_currency': 'KRW',
                'dable_items': [
                    { 'product_id': 'SKU-001' },
                    { 'product_id': 'SKU-002' }
                ],
                'event': 'purchase_completed'
            });
            appendLog('[Purchase] value: 89000, currency: KRW, dable_items: 2 items');
        }

        appendLog('페이지 로드 완료 - DPA 이벤트 테스트 준비');
        appendLog('ViewContent용 dable_items가 dataLayer에 미리 세팅됨: [{product_id: "SKU-001"}]');
    </script>
</body>
</html>
