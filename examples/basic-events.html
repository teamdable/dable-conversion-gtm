<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Dable Conversion Basic Events Test</title>
    
    <!-- Google Tag Manager - Official Installation Code -->
    <!-- https://developers.google.com/tag-platform/tag-manager/datalayer -->
    <script>
      window.dataLayer = window.dataLayer || [];
    </script>
    <script>(function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':
    new Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],
    j=d.createElement(s),dl=l!='dataLayer'?'&l='+l:'';j.async=true;j.src=
    'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);
    })(window,document,'script','dataLayer','GTM-XXXXXXX');</script>
    <!-- End Google Tag Manager -->
    
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        button { padding: 10px 20px; margin: 5px; font-size: 16px; background: #3498db; color: white; border: none; }
        .log { background: #f4f4f4; padding: 10px; margin-top: 20px; font-family: monospace; white-space: pre-wrap; }
    </style>
</head>
<body>
    <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-XXXXXXX"
    height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>

    <h1>Dable Conversion 기본 이벤트 테스트</h1>

    <h2>이벤트 테스트</h2>
    <button onclick="testPageView()">PageView</button>
    <button onclick="testViewContent()">ViewContent</button>
    <button onclick="testSearch()">Search</button>
    <button onclick="testLead()">Lead</button>
    <button onclick="testCompleteRegistration()">CompleteRegistration</button>
    <button onclick="testAddToCart()">AddToCart</button>
    <button onclick="testInitiateCheckout()">InitiateCheckout</button>
    
    <h2>로그</h2>
    <button onclick="clearLog()">지우기</button>
    <div id="log" class="log">로그가 여기에 표시됩니다...</div>

    <script>
        // DataLayer는 이미 head에서 초기화됨
        
        function log(message) {
            const logDiv = document.getElementById('log');
            const timestamp = new Date().toLocaleTimeString();
            logDiv.textContent += `[${timestamp}] ${message}\n`;
        }

        function testPageView() {
            dataLayer.push({ 'event': 'dable_pageview' });
            log('PageView 이벤트 전송');
        }

        function testViewContent() {
            dataLayer.push({ 'event': 'dable_viewcontent' });
            log('ViewContent 이벤트 전송');
        }

        function testSearch() {
            dataLayer.push({ 'event': 'dable_search' });
            log('Search 이벤트 전송');
        }

        function testLead() {
            dataLayer.push({ 'event': 'dable_lead' });
            log('Lead 이벤트 전송');
        }

        function testCompleteRegistration() {
            dataLayer.push({ 'event': 'dable_registration' });
            log('CompleteRegistration 이벤트 전송');
        }

        function testAddToCart() {
            dataLayer.push({ 'event': 'dable_addtocart' });
            log('AddToCart 이벤트 전송');
        }

        function testInitiateCheckout() {
            dataLayer.push({ 'event': 'dable_checkout' });
            log('InitiateCheckout 이벤트 전송');
        }

        function clearLog() {
            document.getElementById('log').textContent = '로그가 여기에 표시됩니다...\n';
        }

        window.addEventListener('load', function() {
            log('페이지 로드 완료 - 기본 이벤트 테스트 준비');
        });
    </script>
</body>
</html>
